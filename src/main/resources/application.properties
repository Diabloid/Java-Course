# Конфігурація підключення до реляційної БД H2 (ЛР 10)
db.url=jdbc:h2:./data/tasktracker_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
db.user=sa
db.password=
db.driver=org.h2.Driver

# Налаштування пулу з'єднань HikariCP (Рівень 3)
hikaricp.maximumPoolSize=10
hikaricp.minimumIdle=2
hikaricp.idleTimeout=30000
hikaricp.connectionTimeout=10000
hikaricp.poolName=TaskTrackerHikariPool
